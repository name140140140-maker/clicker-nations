<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>World Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; background: #1f7fe8; }
      .boot0 { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 20%, #6cc6ff 0%, #1f7fe8 55%, #0f3f93 100%); }
      .boot0-r { width: 48px; height: 48px; border-radius: 50%; border: 5px solid #fff; border-top-color: #ffd54a; background: #1f7fe8; box-shadow: 0 0 0 3px #0b2a6b; animation: boot0 0.9s linear infinite; }
      @keyframes boot0 { to { transform: rotate(360deg); } }
    </style>
    <link rel="prefetch" href="/data/world-topology-lite.json" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"><div class="boot0"><div class="boot0-r"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
